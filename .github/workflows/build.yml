name: Auto-Extract and Build Magisk HFP Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded Source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in the root directory!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted_src
          if [ -d "extracted_src/bt-hfp-client" ]; then
            cp -rf extracted_src/bt-hfp-client/* .
          else
            cp -rf extracted_src/* .
          fi
          rm -rf extracted_src "$ZIP_FILE"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 33 Build Tools & Platform
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Companion App APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias btheadset -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=BtHeadset, OU=Dev, O=Custom, L=Local, ST=State, C=US"

      - name: Build & Sign Magisk RRO Overlay APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          mkdir -p overlay_build/compiled
          $BUILD_TOOLS/aapt2 compile --dir magisk-hfp-client/overlay-src/res -o overlay_build/compiled/
          $BUILD_TOOLS/aapt2 link \
            -o overlay_build/hfp-overlay-unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest magisk-hfp-client/overlay-src/AndroidManifest.xml \
            --auto-add-overlay \
            overlay_build/compiled/*.flat
          $BUILD_TOOLS/zipalign -p -f 4 overlay_build/hfp-overlay-unsigned.apk overlay_build/hfp-overlay-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --out overlay_build/HfpClientOverlay.apk overlay_build/hfp-overlay-aligned.apk

      - name: Sign Companion APK & Assemble Magisk ZIP
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p magisk-hfp-client/system/priv-app/BtHeadsetCompanion
          mkdir -p magisk-hfp-client/system/product/overlay
          $BUILD_TOOLS/zipalign -p -f 4 "$RAW_APK" companion-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --out magisk-hfp-client/system/priv-app/BtHeadsetCompanion/BtHeadsetCompanion.apk companion-aligned.apk
          cp overlay_build/HfpClientOverlay.apk magisk-hfp-client/system/product/overlay/HfpClientOverlay.apk
          rm -rf magisk-hfp-client/overlay-src
          cd magisk-hfp-client
          zip -r9 ../Magisk-Mi11i-HFP-Client.zip .

      - name: Upload Flashable Magisk Module & APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-Mi11i-HFP-Client
          path: |
            Magisk-Mi11i-HFP-Client.zip
            magisk-hfp-client/system/priv-app/BtHeadsetCompanion/BtHeadsetCompanion.apk
